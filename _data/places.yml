# Places that light up on the travel map at /travel/map/.
#
# Add one entry per place. Three forms work:
#
#   - Tokyo                      # a bare name. The map looks up the coordinates in its
#                                # built-in list of about 350 cities. Accents and punctuation do not matter.
#   - name: Lisbon
#     journal: lisbon            # links the light to _travel/lisbon.md
#   - name: Hinterzarten         # a place outside the built-in list needs coordinates.
#     country: Germany
#     lat: 47.9033
#     lon: 8.1053
#
# To find coordinates, right-click a point in Google Maps and copy the two numbers, or
# open the place on https://www.openstreetmap.org and read lat/lon from the URL.
#
# The old City Lights page exported a JSON array of {name, country, lat, lon} objects.
# You can paste that array here as it is, because YAML accepts JSON.
#
# Commit the change and the site rebuilds in about two minutes.

